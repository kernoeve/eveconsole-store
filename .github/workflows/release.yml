# A tag v<version> becomes a release carrying the built Worker and its manifest — what
# EVE Console's Deploy and Update buttons fetch. The tag must match package.json's version.
#
# ⚠️ A tag with a hyphen (v0.2.0-rc.1) is published as a PRE-RELEASE. Released apps never deploy
# or offer one; a development build of the app deploys it like any other, so a candidate is
# tried on a real store, on Cloudflare, before anyone else can get it. Then bump package.json
# and wrangler.toml to the plain version and tag that.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle
      - name: The tag names the version in package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "${GITHUB_REF_NAME}" = "v${v}" ] || { echo "tag ${GITHUB_REF_NAME} but package.json says ${v}"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "${GITHUB_REF_NAME}" in *-*) pre="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/index.js dist/manifest.json --title "${GITHUB_REF_NAME}" --generate-notes $pre
